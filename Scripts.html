<script>
// ==========================================
// สถานะแอปพลิเคชัน (Global State)
// ==========================================
let appState = {
  sessionToken: sessionStorage.getItem('sessionToken') || '',
  currentUser: null,
  settings: {},
  activePage: 'dashboard',
  recipientsList: [],
  medicinesList: [],
  visitsList: [],
  selectedRecipient: null,
  selectedVisit: null
};

// ==========================================
// ตัวช่วยการทำงานหลัก (Core Helpers)
// ==========================================

/**
 * แสดงแถบ Loading Overlay
 */
function showLoading(text = 'กำลังโหลดข้อมูล...') {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.add('active');
}

/**
 * ซ่อนแถบ Loading Overlay
 */
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
}

/**
 * แสดง Toast Notification
 */
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  let icon = 'fa-check-circle';
  if (type === 'danger') icon = 'fa-exclamation-circle';
  if (type === 'warning') icon = 'fa-exclamation-triangle';
  
  toast.innerHTML = `
    <i class="fas ${icon} toast-icon"></i>
    <div class="toast-message">${message}</div>
  `;
  
  container.appendChild(toast);
  
  // อนิเมชันแสดง
  setTimeout(() => toast.classList.add('active'), 50);
  
  // ซ่อนและทำลายหลัง 4 วินาที
  setTimeout(() => {
    toast.classList.remove('active');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

/**
 * เรียกฟังก์ชัน Apps Script ฝั่ง Server ปลอดภัย
 */
function callBackend(functionName, args = [], successCallback, errorCallback) {
  showLoading();
  
  // สร้างอินสแตนซ์เรียก google.script.run
  let runner = google.script.run
    .withFailureHandler(function(err) {
      hideLoading();
      showToast(err.message, 'danger');
      if (errorCallback) errorCallback(err);
      
      // หากเซสชันหมดอายุ ให้ส่งกลับไปที่หน้า Login
      if (err.message.indexOf('เซสชันหมดอายุ') !== -1 || err.message.indexOf('กรุณาเข้าสู่ระบบ') !== -1) {
        logoutLocal();
      }
    })
    .withSuccessHandler(function(response) {
      hideLoading();
      if (successCallback) successCallback(response);
    });
    
  // รันฟังก์ชันตามชื่อและอาร์กิวเมนต์
  if (args.length === 0) {
    runner[functionName]();
  } else if (args.length === 1) {
    runner[functionName](args[0]);
  } else if (args.length === 2) {
    runner[functionName](args[0], args[1]);
  } else if (args.length === 3) {
    runner[functionName](args[0], args[1], args[2]);
  }
}

/**
 * ล้างข้อมูลเซสชันฝั่ง Client และแสดงหน้าเข้าสู่ระบบ
 */
function logoutLocal() {
  sessionStorage.removeItem('sessionToken');
  appState.sessionToken = '';
  appState.currentUser = null;
  
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  
  // ซ่อนสวิตช์โหมดทดลอง/ปุ่มทดลองหากเซสชันหลุด
  checkDemoAvailability();
}

// ==========================================
// การเริ่มต้นระบบและจัดการสิทธิ์ (Init & Auth)
// ==========================================

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

/**
 * เริ่มทำงานแอปพลิเคชัน
 */
function initApp() {
  // ตรวจสอบว่าเปิดผ่าน LINE LIFF หรือมีพารามิเตอร์ LIFF หรือไม่
  const isLiff = checkLiffModeOnLoad();
  initLiffSdk();

  // บันทึกฟอร์ม Login
  document.getElementById('loginForm').addEventListener('submit', handleLogin);
  document.getElementById('demoLoginBtn').addEventListener('click', handleDemoLogin);
  
  // ซิงก์ตราสัญลักษณ์วิทยาลัยพยาบาลทหารอากาศ
  syncCollegeLogos();

  // จัดการการเปิดหน้าเมนูต่างๆ
  setupNavigation();
  
  // เช็กว่าเปิด/ปิด Demo อยู่หรือไม่ เพื่อแสดงปุ่มที่หน้าล็อกอิน
  checkDemoAvailability();
  
  // หากมีโทเคนอยู่แล้ว ให้ทำการตรวจสอบสิทธิ์อัตโนมัติ
  if (appState.sessionToken) {
    verifySessionToken();
  } else {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('appView').style.display = 'none';
    hideLoading();
  }
}

/**
 * ฟังก์ชันช่วยกรอกชื่อผู้ใช้และรหัสผ่านเริ่มต้นอย่างรวดเร็ว
 */
function fillQuickCredentials(username, password) {
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  if (userEl && passEl) {
    userEl.value = username || 'admin';
    passEl.value = password || '1234';
    userEl.classList.add('input-highlight');
    passEl.classList.add('input-highlight');
    setTimeout(function() {
      userEl.classList.remove('input-highlight');
      passEl.classList.remove('input-highlight');
    }, 1200);
    showToast('กรอกข้อมูลเข้าสู่ระบบเรียบร้อย (ชื่อผู้ใช้: ' + userEl.value + ')', 'info');
  }
}

/**
 * ซิงก์ตราสัญลักษณ์วิทยาลัยพยาบาลทหารอากาศไปยังทุกตำแหน่ง
 */
function syncCollegeLogos() {
  const mainLogo = document.getElementById('loginLogoImg');
  if (mainLogo && mainLogo.src) {
    document.querySelectorAll('.rtafnc-logo-img').forEach(function(img) {
      if (img !== mainLogo && (!img.src || img.src === window.location.href)) {
        img.src = mainLogo.src;
      }
    });
  }
}

/**
 * ตรวจสอบสถานะการตั้งค่าเปิดใช้งานโหมดทดลองที่หน้าเข้าสู่ระบบ
 */
function checkDemoAvailability() {
  google.script.run
    .withSuccessHandler(function(enabled) {
      const demoBtn = document.getElementById('demoLoginBtn');
      if (enabled) {
        demoBtn.style.display = 'inline-flex';
      } else {
        demoBtn.style.display = 'none';
      }
    })
    .withFailureHandler(function() {
      document.getElementById('demoLoginBtn').style.display = 'none';
    })
    .isDemoEnabled();
}

/**
 * จัดการสิทธิ์การส่งเข้าสู่ระบบ (Normal Login)
 */
function handleLogin(e) {
  e.preventDefault();
  
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  
  const username = userEl.value.trim();
  const password = passEl.value;
  
  if (!username || !password) {
    showToast('กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน', 'warning');
    return;
  }
  
  // ป้องกันปุ่มเบิ้ลส่งข้อมูลซ้ำ
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');
  loginSubmitBtn.disabled = true;
  
  showLoading('กำลังเข้าสู่ระบบ...');
  
  google.script.run
    .withSuccessHandler(function(response) {
      hideLoading();
      loginSubmitBtn.disabled = false;
      
      if (response.success) {
        appState.sessionToken = response.sessionToken;
        sessionStorage.setItem('sessionToken', response.sessionToken);
        
        showToast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับ', 'success');
        
        userEl.value = '';
        passEl.value = '';
        
        verifySessionToken();
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      loginSubmitBtn.disabled = false;
      showToast(err.message, 'danger');
    })
    .loginUser(username, password);
}

/**
 * เข้าใช้งานด้วยโหมดทดลอง (Demo Login)
 */
function handleDemoLogin() {
  showLoading('กำลังเตรียมโหมดทดลองใช้...');
  
  google.script.run
    .withSuccessHandler(function(response) {
      hideLoading();
      if (response.success) {
        appState.sessionToken = response.sessionToken;
        sessionStorage.setItem('sessionToken', response.sessionToken);
        
        showToast('เข้าสู่ระบบโหมดทดลองใช้งานสำเร็จ', 'success');
        verifySessionToken();
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast(err.message, 'danger');
    })
    .loginDemoUser();
}

/**
 * ส่งออกระบบ (Logout)
 */
function handleLogout() {
  if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
    callBackend('logoutUser', [appState.sessionToken], function() {
      logoutLocal();
      showToast('ออกจากระบบเรียบร้อยแล้ว', 'info');
    });
  }
}

/**
 * ตรวจสอบความถูกต้องของเซสชันโทเคน
 */
function verifySessionToken() {
  showLoading('กำลังเชื่อมต่อระบบสุขภาพ...');
  
  google.script.run
    .withSuccessHandler(function(user) {
      if (!user) {
        hideLoading();
        logoutLocal();
        return;
      }
      appState.currentUser = user;
      
      // ดึงค่าตั้งค่าระบบมาก่อนทำงาน
      google.script.run
        .withSuccessHandler(function(settings) {
          appState.settings = {};
          if (Array.isArray(settings)) {
            settings.forEach(item => {
              appState.settings[item.SettingKey] = item.SettingValue;
            });
          }
          
          hideLoading();
          
          // โหลดเมนูและฉายภาพ
          renderSidebarMenu();
          applySettingsLabels();
          
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('appView').style.display = 'flex';
          
          // กำหนดผู้ใช้ที่แสดงในหน้าจอ
          document.getElementById('avatarInitial').textContent = (user.fullName || 'A').substring(0, 1);
          document.getElementById('userNameDisplay').textContent = user.fullName || 'ผู้ดูแลระบบ';
          document.getElementById('userRoleDisplay').textContent = getRoleThai(user.role);
          
          // แสดงป้ายทดลองเมื่อล็อกอินด้วย DEMO
          const badge = document.getElementById('demoBadgeHeader');
          if (badge) {
            badge.style.display = (user.role === 'DEMO') ? 'inline-block' : 'none';
          }
          
          // นำไปยังหน้าแดชบอร์ดเริ่มต้น
          showPage('dashboard');
        })
        .withFailureHandler(function(err) {
          // หากดึง settings มีปัญหา ให้เข้าใช้งานด้วยค่า default ได้ทันที ไม่ค้างหน้าล็อกอิน
          hideLoading();
          appState.settings = {};
          renderSidebarMenu();
          applySettingsLabels();
          
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('appView').style.display = 'flex';
          
          document.getElementById('avatarInitial').textContent = (user.fullName || 'A').substring(0, 1);
          document.getElementById('userNameDisplay').textContent = user.fullName || 'ผู้ดูแลระบบ';
          document.getElementById('userRoleDisplay').textContent = getRoleThai(user.role);
          
          showPage('dashboard');
        })
        .getSettings(appState.sessionToken);
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('การเชื่อมต่อเซสชันล้มเหลว: ' + err.message, 'danger');
      logoutLocal();
    })
    .getCurrentUser(appState.sessionToken);
}

/**
 * แปลงชื่อบทบาทผู้ใช้ภาษาไทย
 */
function getRoleThai(role) {
  const roles = {
    'ADMIN': 'ผู้ดูแลระบบ (ADMIN)',
    'MEDICAL': 'เจ้าหน้าที่พยาบาล (MEDICAL)',
    'STAFF': 'เจ้าหน้าที่ประจำส่วน (STAFF)',
    'VIEWER': 'ผู้เข้าดูทั่วไป (VIEWER)',
    'DEMO': 'ผู้ใช้ทดลองระบบ (DEMO)'
  };
  return roles[role] || role;
}

// ==========================================
// ส่วนควบคุมเมนูและการแสดงผล (Router & UI)
// ==========================================

/**
 * ตั้งค่าการกดคลิกที่ Sidebar เมนู
 */
function setupNavigation() {
  // เมนูปกติ
  const links = document.querySelectorAll('.sidebar-link[data-page]');
  links.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const pageId = this.getAttribute('data-page');
      showPage(pageId);
    });
  });
  
  // ปุ่มออกจากระบบ
  document.getElementById('logoutLink').addEventListener('click', function(e) {
    e.preventDefault();
    handleLogout();
  });
  
  // ปุ่มซ่อนเมนูด้านซ้าย
  document.getElementById('toggleSidebar').addEventListener('click', function() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
  });
  
  // รองรับ Mobile Sidebar drawer toggle
  document.getElementById('mobileMenuToggle').addEventListener('click', function() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('mobile-active');
  });
  
  // ปิด drawer เมื่อกดยืดหน้าจอในโมบาย
  document.getElementById('sidebar').addEventListener('click', function(e) {
    if (window.innerWidth <= 768 && e.target.closest('.sidebar-link')) {
      this.classList.remove('mobile-active');
    }
  });
}

/**
 * ซ่อนหรือแสดงเมนูตามระดับสิทธิ์ของผู้ใช้งาน
 */
function renderSidebarMenu() {
  const role = appState.currentUser.role;
  
  const menuConfig = {
    'ADMIN': ['dashboard', 'recipients', 'visits', 'medicines', 'referrals', 'followups', 'reports', 'users', 'settings', 'logs'],
    'MEDICAL': ['dashboard', 'recipients', 'visits', 'medicines', 'referrals', 'followups', 'reports'],
    'STAFF': ['dashboard', 'recipients'],
    'VIEWER': ['dashboard', 'reports'],
    'DEMO': ['dashboard', 'recipients', 'visits', 'medicines', 'referrals', 'followups', 'reports']
  };
  
  const allowedPages = menuConfig[role] || ['dashboard'];
  
  const items = document.querySelectorAll('.sidebar-item[data-menu]');
  items.forEach(item => {
    const key = item.getAttribute('data-menu');
    if (allowedPages.indexOf(key) !== -1) {
      item.style.display = 'block';
    } else {
      item.style.display = 'none';
    }
  });
  
  // ซ่อนระบบจัดการประวัติล็อกการใช้งานหากบทบาทไม่ให้เข้า
  const logsItem = document.querySelector('.sidebar-item[data-menu="logs"]');
  if (role === 'ADMIN') {
    if (logsItem) logsItem.style.display = 'block';
  } else {
    if (logsItem) logsItem.style.display = 'none';
  }
}

/**
 * อัปเดตคำนิยามผู้รับบริการและข้อมูลหน่วยงานตามที่ ADMIN กำหนดใน Settings
 */
function applySettingsLabels() {
  const settings = appState.settings;
  if (!settings) return;
  
  // เปลี่ยนชื่อระบบและชื่อหน่วยงาน
  document.getElementById('orgNameDisplay').textContent = settings.ORGANIZATION_NAME || '';
  document.getElementById('sysNameDisplay').textContent = settings.SYSTEM_NAME || 'ระบบเวชระเบียนสุขภาพ';
  
  const recipientLabel = settings.RECIPIENT_LABEL || 'ผู้รับบริการ';
  const contactLabel = settings.CONTACT_LABEL || 'ผู้ติดต่อ';
  const groupLabel = settings.GROUP_LABEL || 'กลุ่ม/แผนก';
  const levelLabel = settings.LEVEL_LABEL || 'ระดับ/แผนกย่อย';
  
  // ค้นหาอิลิเมนต์ที่ระบุแอตทริบิวต์และแทนที่เนื้อหา
  document.querySelectorAll('[data-label-recipient]').forEach(el => {
    el.textContent = el.textContent.replace(/ผู้รับบริการ/g, recipientLabel);
  });
  
  document.querySelectorAll('[data-label-contact]').forEach(el => {
    el.textContent = el.textContent.replace(/ผู้ติดต่อ/g, contactLabel);
  });
  
  document.querySelectorAll('[data-label-group]').forEach(el => {
    el.textContent = el.textContent.replace(/กลุ่ม\/แผนก/g, groupLabel);
  });
  
  document.querySelectorAll('[data-label-level]').forEach(el => {
    el.textContent = el.textContent.replace(/ระดับ\/แผนกย่อย/g, levelLabel);
  });
  
  // จัดการฟิลด์ประเภทโมดูลจ่ายยา ส่งตัว และติดตามตัว
  const isMedEnabled = settings.MEDICINE_MODULE_ENABLED === 'TRUE';
  const isRefEnabled = settings.REFERRAL_MODULE_ENABLED === 'TRUE';
  const isFolEnabled = settings.FOLLOWUP_MODULE_ENABLED === 'TRUE';
  
  document.querySelectorAll('.med-module-only').forEach(el => {
    el.style.display = isMedEnabled ? '' : 'none';
  });
  document.querySelectorAll('.ref-module-only').forEach(el => {
    el.style.display = isRefEnabled ? '' : 'none';
  });
  document.querySelectorAll('.fol-module-only').forEach(el => {
    el.style.display = isFolEnabled ? '' : 'none';
  });
  
  // ลบแถวเมนูด้านซ้ายตามฟิลด์ตั้งค่าโมดูล
  if (!isMedEnabled) {
    const medLink = document.querySelector('.sidebar-item[data-menu="medicines"]');
    if (medLink) medLink.style.display = 'none';
  }
  if (!isRefEnabled) {
    const refLink = document.querySelector('.sidebar-item[data-menu="referrals"]');
    if (refLink) refLink.style.display = 'none';
  }
  if (!isFolEnabled) {
    const folLink = document.querySelector('.sidebar-item[data-menu="followups"]');
    if (folLink) folLink.style.display = 'none';
  }
}

/**
 * แสดงหน้าเพจและเรียกใช้ตัวดึงข้อมูล
 */
function navigateTo(pageId) {
  showPage(pageId);
}

function openNewReferralModal() {
  navigateTo('referrals');
}

/**
 * เรียกฟังก์ชันซิงค์ข้อมูลจาก Google Drive เข้าสู่ระบบ
 */
function triggerDriveSync() {
  if (!confirm('ต้องการซิงค์และนำเข้าข้อมูลเวชระเบียนและรายชื่อ นพอ. จาก Google Drive ใช่หรือไม่?')) return;
  showLoading();
  callBackend('syncDataFromGoogleDrive', [appState.sessionToken], function(res) {
    hideLoading();
    if (res.success) {
      showToast('ซิงค์ข้อมูลจาก Google Drive สำเร็จ! นำเข้า นพอ. ' + (res.syncedStudentsCount || 0) + ' ราย', 'success');
      loadRecipients();
      loadDashboard();
    } else {
      showToast(res.error || 'เกิดข้อผิดพลาดในการซิงค์', 'danger');
    }
  }, function(err) {
    hideLoading();
    showToast(err.message, 'danger');
  });
}

function showPage(pageId) {
  // ยกเลิกหน้าเก่า
  const oldActive = document.querySelector('.sidebar-link.active');
  if (oldActive) oldActive.classList.remove('active');
  
  // ไฮไลต์หน้าใหม่ (Sidebar)
  const newActive = document.querySelector(`.sidebar-link[data-page="${pageId}"]`);
  if (newActive) newActive.classList.add('active');

  // ไฮไลต์หน้าใหม่ (Mobile Bottom Nav)
  const oldMobile = document.querySelector('.mobile-nav-item.active');
  if (oldMobile) oldMobile.classList.remove('active');
  const newMobile = document.querySelector(`.mobile-nav-item[data-mobile-page="${pageId}"]`);
  if (newMobile) newMobile.classList.add('active');
  
  // ซ่อนแผงหน้าเดิมทั้งหมด
  const pages = document.querySelectorAll('.page-view');
  pages.forEach(p => p.style.display = 'none');
  
  // แสดงหน้าใหม่
  const activePageEl = document.getElementById(`${pageId}Page`);
  if (activePageEl) {
    activePageEl.style.display = 'block';
  }
  
  appState.activePage = pageId;
  
  // โหลดหน้าจอเจาะลึก
  switch (pageId) {
    case 'dashboard':
      loadDashboard();
      break;
    case 'recipients':
      loadRecipients();
      break;
    case 'visits':
      loadVisits();
      break;
    case 'medicines':
      loadMedicines();
      break;
    case 'referrals':
      loadReferrals();
      break;
    case 'followups':
      loadFollowUps();
      break;
    case 'reports':
      loadReports();
      break;
    case 'users':
      loadUsers();
      break;
    case 'settings':
      loadSettings();
      break;
    case 'logs':
      loadAuditLogs();
      break;
  }
}

// ==========================================
// ตัวจัดการหน้า Dashboard (Dashboard Controller)
// ==========================================
function loadDashboard() {
  callBackend('getDashboardData', [appState.sessionToken], function(data) {
    // อัปเดตการ์ด
    document.getElementById('dashTodayCount').textContent = data.todayCount;
    document.getElementById('dashMonthCount').textContent = data.monthCount;
    document.getElementById('dashTotalRecipients').textContent = data.totalRecipients;
    document.getElementById('dashObsCount').textContent = data.obsCount;
    document.getElementById('dashReturnedCount').textContent = data.returnedCount;
    document.getElementById('dashRefCount').textContent = data.refCount;
    document.getElementById('dashFollowUpCount').textContent = data.pendingFollowUp;
    document.getElementById('dashLowStockCount').textContent = data.medLowStock;
    document.getElementById('dashNearExpiryCount').textContent = data.medNearExpiry;
    document.getElementById('dashExpiredCount').textContent = data.medExpired;
    
    // ตารางประวัติล่าสุด 5 รายการ
    const tbody = document.getElementById('dashRecentVisitsBody');
    tbody.innerHTML = '';
    
    if (data.latestVisits.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center">ไม่มีข้อมูลการเข้ารับบริการในวันนี้</td></tr>`;
      return;
    }
    
    data.latestVisits.forEach(v => {
      tbody.innerHTML += `
        <tr>
          <td>${v.id}</td>
          <td><strong>${v.name}</strong></td>
          <td>${v.group}</td>
          <td>${v.complaint}</td>
          <td>${v.time} น.</td>
          <td>${getOutcomeBadge(v.outcome)}</td>
          <td>${v.recordedBy}</td>
        </tr>
      `;
    });
  });
}

function getOutcomeBadge(outcome) {
  const classes = {
    'อาการดีขึ้น กลับไปปฏิบัติกิจกรรม': 'badge-success',
    'พักสังเกตอาการ': 'badge-warning',
    'ผู้ติดต่อรับกลับ': 'badge-info',
    'ส่งต่อสถานพยาบาล': 'badge-danger',
    'เรียกรถฉุกเฉิน': 'badge-danger',
    'นัดติดตามอาการ': 'badge-secondary'
  };
  const cls = classes[outcome] || 'badge-secondary';
  return `<span class="badge ${cls}">${outcome}</span>`;
}

/**
 * ดึงและแสดงรายการผู้รับบริการ
 */
function loadRecipients() {
  const searchVal = document.getElementById('recipientSearchInput').value;
  const typeVal = document.getElementById('recipientTypeFilter').value;
  const statusVal = document.getElementById('recipientStatusFilter').value;
  
  const filters = {
    search: searchVal,
    type: typeVal,
    status: statusVal
  };
  
  callBackend('getServiceRecipients', [appState.sessionToken, filters], function(list) {
    appState.recipientsList = list;
    const tbody = document.getElementById('recipientsTableBody');
    tbody.innerHTML = '';
    
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center">ไม่พบข้อมูลทะเบียนสุขภาพตามตัวกรอง</td></tr>`;
      return;
    }
    
    const role = appState.currentUser.role;
    
    list.forEach(r => {
      const isDemoBadge = r.IsDemo ? '<span class="badge badge-warning">Demo</span> ' : '';
      const statusBadge = r.Status === 'Active' ? '<span class="badge badge-success">ปกติ</span>' : '<span class="badge badge-danger">ปิดใช้งาน</span>';
      
      // การจำกัดปุ่มสิทธิ์
      let actionsHtml = `<button class="btn btn-outline btn-sm" onclick="viewRecipientProfile('${r.RecipientID}')"><i class="fas fa-id-card"></i> แฟ้มประวัติ</button>`;
      
      if (role !== 'VIEWER') {
        actionsHtml += ` <button class="btn btn-primary btn-sm" onclick="openEditRecipientModal('${r.RecipientID}')"><i class="fas fa-edit"></i> แก้ไข</button>`;
      }
      
      if (role === 'ADMIN' || role === 'MEDICAL') {
        actionsHtml += ` <button class="btn btn-secondary btn-sm" onclick="openNewVisitFromRecipient('${r.RecipientID}')"><i class="fas fa-notes-medical"></i> บันทึกตรวจ</button>`;
      }
      
      const studentIdBadge = r.NumberOrOrder ? `<span class="badge-student-id"><i class="fas fa-id-badge"></i> ${r.NumberOrOrder}</span><br>` : '';
      tbody.innerHTML += `
        <tr>
          <td>${isDemoBadge}${studentIdBadge}<small class="text-muted">${r.RecipientID}</small></td>
          <td><strong>${r.Title}${r.FirstName} ${r.LastName}</strong></td>
          <td>${r.Nickname || '-'}</td>
          <td>${r.RecipientType}</td>
          <td>${r.Group || '-'} / ${r.Level || '-'}</td>
          <td>${r.CongenitalDiseases !== '-' && r.CongenitalDiseases ? `<span class="badge badge-danger">${r.CongenitalDiseases}</span>` : '-'}</td>
          <td>${statusBadge}</td>
          <td>${actionsHtml}</td>
        </tr>
      `;
    });
  });
}

/**

 */
function handleSaveRecipient(e) {
  e.preventDefault();
  
  const recId = document.getElementById('recEditId').value;
  const firstName = document.getElementById('recFirstName').value.trim();
  const lastName = document.getElementById('recLastName').value.trim();
  
  if (!firstName || !lastName) {
    showToast('กรุณากรอกชื่อและนามสกุลผู้รับบริการ', 'warning');
    return;
  }
  
  // ป้องกันปุ่มเบิ้ลกดซ้ำ
  const submitBtn = document.getElementById('recipientSubmitBtn');
  submitBtn.disabled = true;
  
  const formData = {
    RecipientID: recId,
    NationalID: document.getElementById('recNationalID').value,
    Title: document.getElementById('recTitle').value,
    FirstName: firstName,
    LastName: lastName,
    Nickname: document.getElementById('recNickname').value,
    Gender: document.getElementById('recGender').value,
    BirthDate: document.getElementById('recBirthDate').value,
    RecipientType: document.getElementById('recRecipientType').value,
    Group: document.getElementById('recGroup').value,
    Level: document.getElementById('recLevel').value,
    Department: document.getElementById('recDepartment').value,
    SubUnit: document.getElementById('recSubUnit').value,
    NumberOrOrder: document.getElementById('recNumberOrOrder').value,
    BloodType: document.getElementById('recBloodType').value,
    Weight: parseFloat(document.getElementById('recWeight').value) || 0,
    Height: parseFloat(document.getElementById('recHeight').value) || 0,
    CongenitalDiseases: document.getElementById('recCongenitalDiseases').value,
    DrugAllergies: document.getElementById('recDrugAllergies').value,
    FoodAllergies: document.getElementById('recFoodAllergies').value,
    OtherAllergies: document.getElementById('recOtherAllergies').value,
    RegularMedicines: document.getElementById('recRegularMedicines').value,
    HealthConstraints: document.getElementById('recHealthConstraints').value,
    RegularHospital: document.getElementById('recRegularHospital').value,
    ContactName: document.getElementById('recContactName').value,
    ContactRelationship: document.getElementById('recContactRelationship').value,
    ContactPhone: document.getElementById('recContactPhone').value,
    EmergencyContact: document.getElementById('recEmergencyContact').value,
    EmergencyPhone: document.getElementById('recEmergencyPhone').value,
    Note: document.getElementById('recNote').value,
    Status: document.getElementById('recStatus').value
  };
  
  callBackend('saveServiceRecipient', [appState.sessionToken, formData], function(res) {
    submitBtn.disabled = false;
    closeModal('recipientModal');
    showToast(res.message, 'success');
    loadRecipients();

function loadVisits() {

  const outcomeVal = document.getElementById('visitOutcomeFilter').value;

    search: searchVal,
    startDate: startVal,
    endDate: endVal,
    outcome: outcomeVal
  };
  
  callBackend('getVisits', [appState.sessionToken, filters], function(list) {
    appState.visitsList = list;

      tbody.innerHTML = `<tr><td colspan="7" class="text-center">ไม่พบข้อมูลการรักษาเวชระเบียน</td></tr>`;

    }

      let actionsHtml = `<button class="btn btn-outline btn-sm" onclick="viewVisitDetails('${v.VisitID}')"><i class="fas fa-file-medical"></i> ดูเวชระเบียน</button>`;

        actionsHtml += ` <button class="btn btn-danger btn-sm" onclick="handleCancelVisit('${v.VisitID}')"><i class="fas fa-ban"></i> ยกเลิก</button>`;
      }
      
      tbody.innerHTML += `
        <tr>

/**
 * ค้นหาผู้รับบริการในระบบด่วนก่อนบันทึกรักษา
 */
function handleQuickSearchRecipient() {
  const query = document.getElementById('visitSearchQuery').value.trim();
  if (query.length < 2) {
    showToast('กรุณากรอกข้อมูลค้นหาอย่างน้อย 2 อักขระ', 'warning');
    return;
  }
  
  callBackend('getServiceRecipients', [appState.sessionToken, { search: query, status: 'Active' }], function(list) {
    const listContainer = document.getElementById('visitRecipientSelectContainer');
    listContainer.innerHTML = '';
    
    if (list.length === 0) {
      listContainer.innerHTML = `<div class="text-danger p-2">ไม่พบผู้รับบริการที่มีชื่อนี้หรือถูกระงับสิทธิ์การลงทะเบียน</div>`;
      return;
    }
    
    if (list.length === 1 && /^\d{7}$/.test(query)) {
      selectRecipientForVisit(list[0]);
      return;
    }
    
    list.forEach(r => {
      const congenital = r.CongenitalDiseases && r.CongenitalDiseases !== '-' ? ` | โรคประจำตัว: ${r.CongenitalDiseases}` : '';
      const drug = r.DrugAllergies && r.DrugAllergies !== '-' ? ` | <span class="text-warning-bold">แพ้ยา: ${r.DrugAllergies}</span>` : '';
      const studentIdBadge = r.NumberOrOrder ? `<span class="badge-student-id mr-1">${r.NumberOrOrder}</span> ` : '';
      
      const item = document.createElement('div');
      item.className = 'profile-info p-2 mb-2 border rounded cursor-pointer';
      item.style.cursor = 'pointer';
      item.innerHTML = `
        <strong>${studentIdBadge}${r.Title}${r.FirstName} ${r.LastName} (${r.Nickname || '-'})</strong>
        <span class="text-xs text-muted">รหัสระบบ: ${r.RecipientID} | ${r.RecipientType} | ${r.Group || '-'} / ${r.Level || '-'}${congenital}${drug}</span>
      `;
      item.onclick = function() {
        selectRecipientForVisit(r);
      };
      listContainer.appendChild(item);
    });
  });
}

/**
 * เลือกผู้ป่วยและนำประวัติแพ้ยาขึ้นเตือน
 */
function selectRecipientForVisit(r) {
  document.getElementById('visitSelectedRecipientID').value = r.RecipientID;
  document.getElementById('visitRecipientNameInput').value = `${r.Title}${r.FirstName} ${r.LastName} (${r.Nickname || '-'})`;
  document.getElementById('visitRecipientSelectContainer').innerHTML = '';
  
  // แสดงประวัติการแพ้ยากับโรคประจำตัวชัดเจน
  const alertContainer = document.getElementById('visitAllergyAlertBox');
  alertContainer.innerHTML = '';
  
  if (r.DrugAllergies && r.DrugAllergies !== '-') {
    alertContainer.innerHTML += `
      <div class="alert-box alert-danger">
        <i class="fas fa-exclamation-triangle"></i>
        <div><strong>โปรดระวัง! คนไข้มีประวัติแพ้ยา:</strong> ${r.DrugAllergies}</div>
      </div>
    `;
    // คัดเกรดค่าแพ้ยากลับไปซิงก์ประวัติ
    document.getElementById('visitDrugAllergyCheckText').value = r.DrugAllergies;
  } else {
    document.getElementById('visitDrugAllergyCheckText').value = '';
  }
  
  if (r.CongenitalDiseases && r.CongenitalDiseases !== '-') {
    alertContainer.innerHTML += `
      <div class="alert-box alert-warning">
        <i class="fas fa-exclamation-triangle"></i>
        <div><strong>โรคประจำตัว:</strong> ${r.CongenitalDiseases}</div>
      </div>
    `;
  }
}

/**
 * เปิดบันทึกเวชระเบียนใหม่ผูกจากปุ่มในหน้าทะเบียนประวัติ
 */
function openNewVisitFromRecipient(recId) {
  closeModal('profileModal');
  showPage('visits');
  openNewVisitModal();
  
  callBackend('getServiceRecipientById', [appState.sessionToken, recId], function(r) {
    selectRecipientForVisit(r);
  });
}

/**
 * เปิดหน้าต่างบันทึกรักษาใหม่
 */
function openNewVisitModal() {
  document.getElementById('visitForm').reset();
  document.getElementById('visitSelectedRecipientID').value = '';
  document.getElementById('visitAllergyAlertBox').innerHTML = '';
  document.getElementById('visitRecipientSelectContainer').innerHTML = '';
  document.getElementById('visitDrugAllergyCheckText').value = '';
  
  // ตั้งวันที่และเวลาปัจจุบันแบบไทย
  const now = new Date();
  document.getElementById('visitDate').value = now.toISOString().substring(0, 10);
  document.getElementById('visitTimeIn').value = now.toTimeString().substring(0, 5);
  
  // ล้างตารางจ่ายยา
  document.getElementById('visitMedicinesList').innerHTML = '';
  
  // เปิด/ปิด ฟังก์ชันสต็อกยา
  const isMedEnabled = appState.settings.MEDICINE_MODULE_ENABLED === 'TRUE';
  if (isMedEnabled) {
    document.getElementById('visitMedicineSection').style.display = 'block';
    loadMedicinesDropdown();
  } else {
    document.getElementById('visitMedicineSection').style.display = 'none';
  }
  
  openModal('visitModal');
}

/**
 * โหลดรายชื่อยาเพื่อขึ้น Dropdown ในตารางจ่ายยา
 */
function loadMedicinesDropdown() {
  callBackend('getMedicines', [appState.sessionToken], function(list) {
    appState.medicinesList = list;
    const select = document.getElementById('visitAddMedSelect');
    select.innerHTML = '<option value="">-- เลือกยาหรือเวชภัณฑ์ --</option>';
    
    list.forEach(m => {
      // คัดกรองยาหมดอายุและไม่ให้ขึ้นแสดงเว้นแต่ admin
      const isExpired = m.ExpiryDate && new Date(m.ExpiryDate) < new Date();
      if (m.Status === 'Active' && !isExpired && m.Quantity > 0) {
        select.innerHTML += `<option value="${m.MedicineID}">${m.MedicineName} (คงเหลือ: ${m.Quantity} ${m.Unit})</option>`;
      }
    });
  });
}

/**
 * เพิ่มแถวจ่ายยาลงในเวชระเบียน
 */
function handleAddMedicineRow() {
  const select = document.getElementById('visitAddMedSelect');
  const qtyEl = document.getElementById('visitAddMedQty');
  
  const medId = select.value;
  const qty = parseInt(qtyEl.value, 10);
  
  if (!medId || isNaN(qty) || qty <= 0) {
    showToast('กรุณาเลือกรายการและจำนวนยาระบุให้ถูกต้อง', 'warning');
    return;
  }
  
  const m = appState.medicinesList.find(x => x.MedicineID === medId);
  if (!m) return;
  
  // ตรวจสอบประวัติแพ้ยาของคนไข้
  const allergyList = document.getElementById('visitDrugAllergyCheckText').value;
  if (allergyList) {
    const allergyLower = allergyList.toLowerCase();
    const medNameLower = m.MedicineName.toLowerCase();
    
    // ตรวจสอบเบื้องต้น
    if (allergyLower.indexOf(medNameLower) !== -1 || medNameLower.indexOf(allergyLower) !== -1) {
      if (!confirm(`คำเตือน: คนไข้มีประวัติแพ้ยาที่คล้ายคลึงกับ "${m.MedicineName}" (ประวัติแพ้ยา: ${allergyList}) ต้องการจ่ายยานี้จริงหรือไม่?`)) {
        return;
      }
    }
  }
  
  if (qty > m.Quantity) {
    showToast(`ยาในคลังมีไม่เพียงพอ (คงเหลือ ${m.Quantity})`, 'warning');
    return;
  }
  
  const listContainer = document.getElementById('visitMedicinesList');
  
  // ตรวจสอบว่ามียาเดิมอยู่ในลิสต์หรือยัง
  if (document.getElementById(`dispRow-${medId}`)) {
    showToast('มีรายการยานี้อยู่แล้วในเวชระเบียน สามารถลบแล้วเพิ่มใหม่ได้', 'warning');
    return;
  }
  
  const row = document.createElement('div');
  row.className = 'row border p-2 mb-2 rounded align-items-center';
  row.id = `dispRow-${medId}`;
  row.innerHTML = `
    <div class="col-md-4">
      <strong>${m.MedicineName}</strong>
      <input type="hidden" name="dispMedId" value="${medId}">
    </div>
    <div class="col-md-2">
      จำนวน: <input type="number" class="form-control d-inline-block" name="dispQty" value="${qty}" style="width:70px;" readonly> ${m.Unit}
    </div>
    <div class="col-md-5">
      วิธีใช้: <input type="text" class="form-control" name="dispDir" value="${m.Precautions || ''}" placeholder="ระบุขนาดและคำแนะนำการใช้ยา">
    </div>
    <div class="col-md-1 text-right">
      <button type="button" class="btn btn-danger btn-sm" onclick="document.getElementById('dispRow-${medId}').remove()"><i class="fas fa-trash"></i></button>
    </div>
  `;
  
  listContainer.appendChild(row);
  
  // รีเซ็ตค่า Input ตัวเพิ่ม
  select.value = '';
  qtyEl.value = '1';
}

/**
 * บันทึกฟอร์มเวชระเบียนเข้าตรวจ
 */
function handleSaveVisit(e) {
  e.preventDefault();
  
  const recId = document.getElementById('visitSelectedRecipientID').value;
  const complaint = document.getElementById('visitChiefComplaint').value.trim();
  
  if (!recId) {
    showToast('กรุณาเลือกผู้รับบริการสุขภาพก่อนทำการบันทึก', 'warning');
    return;
  }
  
  if (!complaint) {
    showToast('กรุณาระบุอาการสำคัญเบื้องต้น', 'warning');
    return;
  }
  
  // ป้องกันปุ่มเบิ้ลกดซ้ำ
  const submitBtn = document.getElementById('visitSubmitBtn');
  submitBtn.disabled = true;
  
  // ดึงรายการยาที่เลือกจ่าย
  const dispMedIds = document.getElementsByName('dispMedId');
  const dispQtys = document.getElementsByName('dispQty');
  const dispDirs = document.getElementsByName('dispDir');
  
  const dispenseMedicines = [];
  for (let i = 0; i < dispMedIds.length; i++) {
    dispenseMedicines.push({
      MedicineID: dispMedIds[i].value,
      Quantity: parseInt(dispQtys[i].value, 10),
      Directions: dispDirs[i].value
    });
  }
  
  const formData = {
    RecipientID: recId,
    VisitDate: document.getElementById('visitDate').value,
    TimeIn: document.getElementById('visitTimeIn').value,
    TimeOut: document.getElementById('visitTimeOut').value,
    AccompaniedBy: document.getElementById('visitAccompaniedBy').value,
    IncidentLocation: document.getElementById('visitIncidentLocation').value,
    IncidentActivity: document.getElementById('visitIncidentActivity').value,
    IncidentType: document.getElementById('visitIncidentType').value,
    ChiefComplaint: complaint,
    IncidentDetails: document.getElementById('visitIncidentDetails').value,
    UrgencyLevel: document.getElementById('visitUrgencyLevel').value,
    Outcome: document.getElementById('visitOutcome').value,
    
    // ข้อมูลสัญญาณชีพ
    vitals: {
      Temperature: parseFloat(document.getElementById('vitalTemp').value) || '',
      Weight: parseFloat(document.getElementById('vitalWeight').value) || '',
      Height: parseFloat(document.getElementById('vitalHeight').value) || '',
      BloodPressureSystolic: parseInt(document.getElementById('vitalBpSys').value, 10) || '',
      BloodPressureDiastolic: parseInt(document.getElementById('vitalBpDia').value, 10) || '',
      Pulse: parseInt(document.getElementById('vitalPulse').value, 10) || '',
      RespiratoryRate: parseInt(document.getElementById('vitalRr').value, 10) || '',
      OxygenSaturation: parseInt(document.getElementById('vitalO2').value, 10) || '',
      PainScore: parseInt(document.getElementById('vitalPain').value, 10) || '0',
      ConsciousnessLevel: document.getElementById('vitalConscious').value,
      Note: document.getElementById('vitalNote').value
    },
    
    // ข้อมูลประเมิน
    assessment: {
      AssessmentDetails: document.getElementById('assessDetails').value,
      Diagnosis: document.getElementById('assessDiagnosis').value
    },
    
    // ข้อมูลการดูแล
    treatment: {
      TreatmentDetails: document.getElementById('treatDetails').value,
      Note: document.getElementById('treatNote').value
    },
    
    dispenseMedicines: dispenseMedicines,
    VisitStatus: 'Closed' // บันทึกเสร็จจะตั้งค่าเป็นเสร็จสิ้นทันที
  };
  
  callBackend('saveVisit', [appState.sessionToken, formData], function(res) {
    submitBtn.disabled = false;
    closeModal('visitModal');
    showToast(res.message, 'success');
    loadVisits();
  }, function() {
    submitBtn.disabled = false;
  });
}

/**
 * ยกเลิกเวชระเบียนและแจ้งเตือน
 */
function handleCancelVisit(id) {
  if (confirm(`คุณต้องการยกเลิกใบงานเวชระเบียนเลขที่ "${id}" ใช่หรือไม่?\nระบบจะทำการคืนยาเข้าสต็อกให้โดยอัตโนมัติหากมีการสั่งจ่ายไว้`)) {
    callBackend('cancelVisit', [appState.sessionToken, id], function(res) {
      showToast(res.message, 'success');
      loadVisits();
    });
  }
}

/**
 * ดูเวชระเบียนใบรักษาเจาะลึก
 */
function viewVisitDetails(id) {
  callBackend('getVisitById', [appState.sessionToken, id], function(v) {
    appState.selectedVisit = v;
    
    // โหลดป้ายรายละเอียดในเวชระเบียนพิมพ์
    document.getElementById('detVisitID').textContent = v.VisitID;
    document.getElementById('detVisitDate').textContent = `${formatDateThai(v.VisitDate)} เวลา ${v.TimeIn} - ${v.TimeOut || 'ไม่ระบุ'} น.`;
    document.getElementById('detRecipient').textContent = `${v.RecipientName} (${v.RecipientType})`;
    document.getElementById('detGroup').textContent = `${v.Group} / ${v.Department || '-'}`;
    document.getElementById('detComplaint').textContent = v.ChiefComplaint;
    document.getElementById('detDetails').textContent = v.IncidentDetails || '-';
    document.getElementById('detOutcome').innerHTML = getOutcomeBadge(v.Outcome);
    document.getElementById('detRecordedBy').textContent = v.RecordedBy;
    
    // จัดการแท็บข้อมูล Vitals
    const vitalsDiv = document.getElementById('detVitalsSection');
    vitalsDiv.innerHTML = '';
    if (v.vitals && v.vitals.length > 0) {

      // แสดงสัญญาณชีพ
      const tempWarn = vt.Temperature >= 37.5 ? 'text-warning-bold' : '';
      const bpWarn = (vt.BloodPressureSystolic >= 140 || vt.BloodPressureSystolic <= 90) ? 'text-warning-bold' : '';
      const pulseWarn = (vt.Pulse >= 100 || vt.Pulse <= 60) ? 'text-warning-bold' : '';
      const o2Warn = vt.OxygenSaturation < 95 ? 'text-warning-bold' : '';
      
      vitalsDiv.innerHTML = `
        <div class="row">
          <div class="col-md-3"><strong>อุณหภูมิ:</strong> <span class="${tempWarn}">${vt.Temperature || '-'} °C</span></div>
          <div class="col-md-3"><strong>ความดันโลหิต:</strong> <span class="${bpWarn}">${vt.BloodPressureSystolic || '-'}/${vt.BloodPressureDiastolic || '-'} mmHg</span></div>
          <div class="col-md-3"><strong>อัตราชีพจร:</strong> <span class="${pulseWarn}">${vt.Pulse || '-'} ครั้ง/นาที</span></div>
          <div class="col-md-3"><strong>ออกซิเจนปลายมือ:</strong> <span class="${o2Warn}">${vt.OxygenSaturation || '-'} %</span></div>
        </div>
        <div class="row mt-2">
          <div class="col-md-3"><strong>น้ำหนัก:</strong> ${vt.Weight || '-'} กก.</div>
          <div class="col-md-3"><strong>ส่วนสูง:</strong> ${vt.Height || '-'} ซม.</div>
          <div class="col-md-3"><strong>ระดับความเจ็บปวด (Pain):</strong> ${vt.PainScore || '0'}/10</div>
          <div class="col-md-3"><strong>ระดับความรู้สึกตัว:</strong> ${vt.ConsciousnessLevel || '-'}</div>
        </div>
        <div class="row mt-2">
          <div class="col-12"><strong>หมายเหตุสัญญาณชีพ:</strong> ${vt.Note || '-'}</div>
        </div>
      `;
    } else {
      vitalsDiv.innerHTML = '<div class="text-muted">ไม่ได้บันทึกข้อมูลสัญญาณชีพ</div>';
    }
    
    // จัดการข้อมูลประเมินและสั่งการ
    const assessDiv = document.getElementById('detAssessmentSection');
    if (v.assessments && v.assessments.length > 0) {
      assessDiv.innerHTML = `
        <div><strong>การวินิจฉัยโรคเบื้องต้น:</strong> ${v.assessments[0].Diagnosis || '-'}</div>
        <div><strong>รายละเอียดการประเมิน:</strong> ${v.assessments[0].AssessmentDetails || '-'}</div>
      `;
    } else {
      assessDiv.innerHTML = '<div class="text-muted">ไม่มีบันทึกประเมินอาการ</div>';
    }
    
    const treatDiv = document.getElementById('detTreatmentSection');
    if (v.treatments && v.treatments.length > 0) {
      treatDiv.innerHTML = `
        <div><strong>การปฐมพยาบาล/รักษา:</strong> ${v.treatments[0].TreatmentDetails || '-'}</div>
        <div><strong>หมายเหตุ:</strong> ${v.treatments[0].Note || '-'}</div>
      `;
    } else {
      treatDiv.innerHTML = '<div class="text-muted">ไม่มีบันทึกการปฐมพยาบาล</div>';
    }
    
    // จัดการตารางแสดงรายการจ่ายยา
    const medsDiv = document.getElementById('detMedicinesSection');
    medsDiv.innerHTML = '';
    
    if (v.dispensing && v.dispensing.length > 0) {
      let tbl = `
        <table class="table-custom mt-2">
          <thead>
            <tr>
              <th>ชื่อยา/เวชภัณฑ์</th>
              <th>จำนวน</th>
              <th>คำอธิบายวิธีใช้</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody>
      `;
      v.dispensing.forEach(m => {
        const cls = m.Status === 'Cancelled' ? 'text-danger line-through' : '';
        tbl += `
          <tr class="${cls}">
            <td><strong>${m.MedicineName}</strong></td>
            <td>${m.Quantity}</td>
            <td>${m.Directions || '-'}</td>
            <td>${m.Status === 'Cancelled' ? '<span class="badge badge-danger">ยกเลิก</span>' : '<span class="badge badge-success">ปกติ</span>'}</td>
          </tr>
        `;
      });
      tbl += '</tbody></table>';
      medsDiv.innerHTML = tbl;
    } else {
      medsDiv.innerHTML = '<div class="text-muted">ไม่มีประวัติการจ่ายยาในเวชระเบียนฉบับนี้</div>';
    }
    
    // จัดการปุ่มโมดูลส่วนส่งต่อและการแจ้งผู้ติดต่อ
    const actionsBox = document.getElementById('visitDetailsActions');
    actionsBox.innerHTML = '';
    
    const role = appState.currentUser.role;
    if (role === 'ADMIN' || role === 'MEDICAL') {
      const isRefEnabled = appState.settings.REFERRAL_MODULE_ENABLED === 'TRUE';
      const isFolEnabled = appState.settings.FOLLOWUP_MODULE_ENABLED === 'TRUE';
      
      actionsBox.innerHTML += `<button class="btn btn-outline" onclick="openContactNotificationModal('${v.VisitID}')"><i class="fas fa-bell"></i> แจ้งเตือนผู้เกี่ยวข้อง</button> `;
      
      if (isRefEnabled) {
        actionsBox.innerHTML += `<button class="btn btn-outline" onclick="openReferralModal('${v.VisitID}')"><i class="fas fa-shipping-fast"></i> ออกใบส่งตัวรักษา</button> `;
      }
      if (isFolEnabled) {
        actionsBox.innerHTML += `<button class="btn btn-outline" onclick="openFollowUpModal('${v.VisitID}')"><i class="fas fa-history"></i> ตั้งนัดติดตามอาการ</button> `;
      }
    }
    
    openModal('visitDetailsModal');
  });
}

// ==========================================
// ส่วนสต็อกยาและสินค้าคงคลัง (Medicines Controller)
// ==========================================

function loadMedicines() {
  callBackend('getMedicines', [appState.sessionToken], function(list) {
    appState.medicinesList = list;
    const tbody = document.getElementById('medicinesTableBody');
    tbody.innerHTML = '';
    
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="text-center">ไม่พบยาหรือเวชภัณฑ์คงคลัง</td></tr>`;
      return;
    }
    
    const role = appState.currentUser.role;
    let warningDays = 90;
    try {
      warningDays = parseInt(appState.settings.EXPIRY_WARNING_DAYS, 10) || 90;
    } catch(e) {}
    
    const limitDate = new Date();
    limitDate.setDate(limitDate.getDate() + warningDays);
    
    list.forEach(m => {
      const isDemoBadge = m.IsDemo ? '<span class="badge badge-warning">Demo</span> ' : '';
      
      // คำนวณสีแจ้งเตือนจำนวนยาคงเหลือต่ำ
      let qtyClass = '';
      if (m.Quantity <= m.AlertThreshold) {
        qtyClass = 'text-warning-bold';
      }
      
      // ตรวจสอบวันหมดอายุ
      let expBadge = '-';
      if (m.ExpiryDate) {
        const exp = new Date(m.ExpiryDate);
        if (exp < new Date()) {
          expBadge = `<span class="badge badge-danger">หมดอายุ (${formatDateThai(m.ExpiryDate)})</span>`;
        } else if (exp <= limitDate) {
          expBadge = `<span class="badge badge-warning">ใกล้หมดอายุ (${formatDateThai(m.ExpiryDate)})</span>`;
        } else {
          expBadge = formatDateThai(m.ExpiryDate);
        }
      }
      
      let actions = '';
      if (role === 'ADMIN' || role === 'MEDICAL') {
        actions = `
          <button class="btn btn-primary btn-sm" onclick="openEditMedModal('${m.MedicineID}')"><i class="fas fa-edit"></i> แก้ไข</button>
          <button class="btn btn-outline btn-sm" onclick="openReceiveStockModal('${m.MedicineID}')"><i class="fas fa-plus"></i> นำเข้า</button>
          <button class="btn btn-secondary btn-sm" onclick="openAdjustStockModal('${m.MedicineID}')"><i class="fas fa-sliders-h"></i> ปรับยอด</button>
        `;
      }
      
      tbody.innerHTML += `
        <tr>
          <td>${isDemoBadge}${m.MedicineCode}</td>
          <td><strong>${m.MedicineName}</strong></td>
          <td>${m.Category}</td>
          <td>${m.Strength}</td>
          <td class="${qtyClass}">${m.Quantity} ${m.Unit}</td>
          <td>${expBadge}</td>
          <td>${m.StorageLocation || '-'}</td>
          <td>${m.Status === 'Active' ? '<span class="badge badge-success">ปกติ</span>' : '<span class="badge badge-danger">ระงับ</span>'}</td>
          <td>${actions}</td>
        </tr>
      `;
    });
  });
}

}

  document.getElementById('medForm').value = m.Form;
  document.getElementById('medStrength').value = m.Strength;
  document.getElementById('medUnit').value = m.Unit;

function handleSaveMedicine(e) {

  const medId = document.getElementById('medEditId').value;

  submitBtn.disabled = true;

    MedicineID: medId,
    MedicineCode: code,
    MedicineName: name,
    Category: document.getElementById('medCategory').value,

    Strength: document.getElementById('medStrength').value,
    Unit: document.getElementById('medUnit').value,
    Quantity: parseInt(document.getElementById('medQty').value, 10) || 0,
    AlertThreshold: parseInt(document.getElementById('medAlertThreshold').value, 10) || 0,
    BatchNumber: document.getElementById('medBatchNumber').value,

  });
}

function openReceiveStockModal(id) {

function handleReceiveStock(e) {

    closeModal('receiveStockModal');

    submitBtn.disabled = false;

function openAdjustStockModal(id) {
  const m = appState.medicinesList.find(x => x.MedicineID === id);
  if (!m) return;
  
  document.getElementById('adjStockMedId').value = m.MedicineID;
  document.getElementById('adjStockNameDisplay').textContent = `${m.MedicineName} (คงเหลือปัจจุบัน: ${m.Quantity} ${m.Unit})`;
  document.getElementById('adjStockQty').value = '-10'; // ค่าตัวอย่างลดสต็อก
  document.getElementById('adjStockNotes').value = '';
  
  openModal('adjustStockModal');
}

function handleAdjustStock(e) {
  e.preventDefault();
  
  const medId = document.getElementById('adjStockMedId').value;
  const qty = parseInt(document.getElementById('adjStockQty').value, 10);
  const notes = document.getElementById('adjStockNotes').value.trim();
  
  if (qty === 0 || isNaN(qty)) {
    showToast('จำนวนปรับสต็อกต้องห้ามเป็นศูนย์', 'warning');
    return;
  }
  
  if (!notes) {
    showToast('กรุณาระบุเหตุผลในการปรับปรุงสินค้าคงคลัง', 'warning');
    return;
  }
  
  const submitBtn = document.getElementById('adjStockSubmitBtn');
  submitBtn.disabled = true;
  
  const formData = {
    MedicineID: medId,
    Quantity: qty,
    Notes: notes
  };
  
  callBackend('adjustMedicineStock', [appState.sessionToken, formData], function(res) {
    submitBtn.disabled = false;
    closeModal('adjustStockModal');
    showToast(res.message, 'success');
    loadMedicines();
  }, function() {
    submitBtn.disabled = false;
  });
}

function openReferralModal(visitId) {
  closeModal('visitDetailsModal');
  
  document.getElementById('refVisitID').value = visitId;
  document.getElementById('refEditId').value = '';
  
  callBackend('getVisitById', [appState.sessionToken, visitId], function(v) {
    document.getElementById('refRecipientID').value = v.RecipientID;
    document.getElementById('refChiefComplaint').value = v.ChiefComplaint;
    
    // เตรียมข้อมูลสัญญาณชีพ
    let vitalsStr = '-';
    if (v.vitals && v.vitals.length > 0) {
      const vt = v.vitals[0];
      vitalsStr = `อุณหภูมิ: ${vt.Temperature}°C, ความดัน: ${vt.BloodPressureSystolic}/${vt.BloodPressureDiastolic} mmHg, ชีพจร: ${vt.Pulse} ครั้ง/นาที`;
    }
    document.getElementById('refLatestVitals').value = vitalsStr;
    
    // ดึงประวัติการปฐมพยาบาล
    let careStr = '';
    if (v.treatments && v.treatments.length > 0) {
      careStr = v.treatments[0].TreatmentDetails;
    }
    document.getElementById('refPreReferralCare').value = careStr;
    
    // ประวัติการจ่ายยา
    let medsStr = '-';
    if (v.dispensing && v.dispensing.length > 0) {
      medsStr = v.dispensing.filter(m => m.Status !== 'Cancelled').map(m => `${m.MedicineName} (${m.Quantity})`).join(', ');
    }
    document.getElementById('refMedicinesGiven').value = medsStr;
    
    // ตั้งค่าเบื้องต้น

    document.getElementById('refEscort').value = 'เจ้าหน้าที่พยาบาลประจำห้องเวชระเบียน';
    document.getElementById('refContactNotified').checked = true;
    document.getElementById('refTimeDeparted').value = new Date().toTimeString().substring(0, 5);
    document.getElementById('refNote').value = '';
    
    openModal('referralModal');
  });

function loadFollowUps() {
  callBackend('getFollowUps', [appState.sessionToken], function(list) {
    const tbody = document.getElementById('followUpsTableBody');
    tbody.innerHTML = '';
    
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center">ไม่พบรายการนัดติดตามสุขภาพ</td></tr>`;
      return;
    }
    
    list.forEach(f => {
      const isDemoBadge = f.IsDemo ? '<span class="badge badge-warning">Demo</span> ' : '';

      if (f.Status === 'Completed') {
        badge = `<span class="badge badge-success">ติดตามแล้ว</span>`;

      } else {
        action = `<span class="text-xs text-muted">เสร็จสิ้นแล้ว</span>`;
      }
      
      tbody.innerHTML += `
        <tr>
          <td>${isDemoBadge}${f.FollowUpID}</td>
          <td>${f.VisitID}</td>
          <td><strong>${f.RecipientID}</strong></td>
          <td>${formatDateThai(f.ScheduledDate)}</td>
          <td>${f.Instructions || '-'}</td>

function loadReports() {
  const type = document.getElementById('reportTypeSelect').value;
  
  // โหลดฟังก์ชันพยาบาล
  const start = document.getElementById('reportStartDate').value;
  const end = document.getElementById('reportEndDate').value;

    startDate: start,
    endDate: end,
    recipientType: recipientType

  callBackend('getReports', [appState.sessionToken, type, filters], function(list) {
    const tableDiv = document.getElementById('reportTableContainer');
    tableDiv.innerHTML = '';
    
    if (list.length === 0) {
      tableDiv.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open empty-icon"></i><p>ไม่พบรายการสถิติการรักษาตามช่วงเวลาที่กำหนด</p></div>`;

    let rows = '';
    
    if (type === 'medicine_warning') {
      ths = `<tr><th>รหัสยา</th><th>ชื่อยา/เวชภัณฑ์</th><th>หมวดหมู่</th><th>จำนวนคงคลัง</th><th>หน่วย</th><th>วันหมดอายุ</th><th>เหตุผลเตือน</th><th>สถานะ</th></tr>`;
      list.forEach(item => {
        rows += `
          <tr>
            <td>${item.MedicineCode}</td>
            <td><strong>${item.MedicineName}</strong></td>
            <td>${item.Category}</td>
            <td>${item.Quantity}</td>
            <td>${item.Unit}</td>
            <td>${item.ExpiryDate}</td>
            <td><span class="text-danger">${item.Reason}</span></td>
            <td>${item.Status}</td>
          </tr>

      });

      ths = `<tr><th>รหัสตรวจ</th><th>วันที่รับบริการ</th><th>เวลา</th><th>ชื่อ-นามสกุล</th><th>ประเภท</th><th>กลุ่ม</th><th>อาการสำคัญ</th><th>ผลการรักษา</th><th>ผู้บันทึก</th></tr>`;
      list.forEach(item => {
        rows += `

function handleExportCsv() {
  const type = document.getElementById('reportTypeSelect').value;
  const start = document.getElementById('reportStartDate').value;
  const end = document.getElementById('reportEndDate').value;
  const recipientType = document.getElementById('reportRecipientTypeFilter').value;
  
  const filters = {
    startDate: start,
    endDate: end,
    recipientType: recipientType
  };
  
  callBackend('exportReportCsv', [appState.sessionToken, type, filters], function(csvContent) {
    if (!csvContent) {
      showToast('ไม่มีข้อมูลสำหรับส่งออกไฟล์ CSV', 'warning');
      return;
    }
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", `report_${type}_${new Date().toISOString().substring(0,10)}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('ดาวน์โหลดรายงาน CSV เรียบร้อยแล้ว', 'success');
  });
}

/**
 * ==========================================
 * LINE Front-end Framework (LIFF) Controller
 * จัดการหน้าจอสำหรับ นพอ. ผ่านแอป LINE
 * ==========================================
 */

let liffCurrentStudent = null;
let liffConfigData = null;

function checkLiffModeOnLoad() {
  const params = new URLSearchParams(window.location.search);
  const isLiff = params.get('page') === 'liff' || params.get('liff') === 'true' || window.location.hash.includes('liff');
  
  if (isLiff) {
    switchToLiffMode();
    const studentIdParam = params.get('id') || params.get('studentId');
    if (studentIdParam && studentIdParam.trim().length === 7) {
      setTimeout(function() {
        quickFillLiffId(studentIdParam.trim());
      }, 400);
    }
    return true;
  }
  return false;
}

function initLiffSdk() {
  if (typeof liff === 'undefined') return;

  google.script.run
    .withSuccessHandler(function(config) {
      liffConfigData = config;
      if (config && config.liffId && config.liffId.trim() !== '') {
        liff.init({ liffId: config.liffId.trim() })
          .then(function() {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(function(profile) {
                const bar = document.getElementById('liffUserProfileBar');
                const nameEl = document.getElementById('liffUserName');
                const avatarEl = document.getElementById('liffUserAvatar');
                if (bar && nameEl) {
                  bar.style.display = 'flex';
                  nameEl.textContent = profile.displayName || 'ผู้ใช้งาน LINE';
                  if (profile.pictureUrl && avatarEl) {
                    avatarEl.src = profile.pictureUrl;
                  }
                }
              }).catch(function(err) {
                console.log('LIFF profile warning:', err);
              });
            }
          })
          .catch(function(err) {
            console.log('LIFF init warning:', err);
          });
      }
    })
    .getLiffConfig();
}

function switchToLiffMode() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'none';
  document.getElementById('liffView').style.display = 'flex';
  
  syncCollegeLogos();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  hideLoading();
}

function switchToMainApp() {
  document.getElementById('liffView').style.display = 'none';
  if (appState.sessionToken) {
    document.getElementById('appView').style.display = 'flex';
  } else {
    document.getElementById('loginView').style.display = 'flex';
  }
}

function switchLiffTab(tabName) {
  document.querySelectorAll('.liff-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.liffTab === tabName);
  });
  
  document.querySelectorAll('.liff-tab-content').forEach(sec => {
    sec.classList.remove('active');
  });
  
  if (tabName === 'lookup') {
    document.getElementById('liffTabLookup').classList.add('active');
  } else if (tabName === 'checkin') {
    document.getElementById('liffTabCheckin').classList.add('active');
    if (liffCurrentStudent) {
      document.getElementById('liffCheckinStudentId').value = liffCurrentStudent.NumberOrOrder || '';
      verifyCheckinStudentId();
    }
  } else if (tabName === 'card') {
    document.getElementById('liffTabCard').classList.add('active');
    if (liffCurrentStudent) {
      renderDigitalHealthCard(liffCurrentStudent);
    }
  }
}

function quickFillLiffId(id) {
  const input = document.getElementById('liffStudentIdInput');
  if (input) {
    input.value = id;
    handleLiffStudentLookup(new Event('submit'));
  }
}

function handleLiffStudentLookup(e) {
  if (e && e.preventDefault) e.preventDefault();
  
  const idInput = document.getElementById('liffStudentIdInput');
  const studentId = idInput.value.trim();
  
  if (!studentId || studentId.length !== 7 || !/^\d{7}$/.test(studentId)) {
    showToast('กรุณากรอกรหัสประจำตัว นพอ. ให้ครบถ้วน 7 หลัก (ตัวเลขเท่านั้น)', 'warning');
    idInput.focus();
    return;
  }
  
  showLoading('กำลังค้นหาข้อมูล นพอ. รหัส ' + studentId + '...');
  
  google.script.run
    .withSuccessHandler(function(student) {
      hideLoading();
      const resContainer = document.getElementById('liffStudentResult');
      
      if (!student) {
        resContainer.style.display = 'block';
        resContainer.innerHTML = `
          <div class="alert-box alert-warning">
            <i class="fas fa-exclamation-circle"></i>
            <div>
              <strong>ไม่พบข้อมูลนักเรียนพยาบาลรหัส ${studentId}</strong>
              <div class="text-xs mt-1">กรุณาตรวจสอบรหัส 7 หลัก หรือติดต่อห้องพยาบาล วพอ.</div>
            </div>
          </div>
        `;
        liffCurrentStudent = null;
        return;
      }
      
      liffCurrentStudent = student;
      
      const hasAllergy = student.DrugAllergies && student.DrugAllergies !== '-' && student.DrugAllergies.trim() !== '';
      const allergyAlertHtml = hasAllergy ? `
        <div class="liff-allergy-danger">
          <i class="fas fa-exclamation-triangle"></i>
          <div>
            <strong style="font-size:0.95rem;">คำเตือนความปลอดภัยทางการแพทย์:</strong>
            <div style="font-size:0.88rem; margin-top:2px;">มีประวัติแพ้ยา: <strong>${student.DrugAllergies}</strong></div>
            <div class="text-xs" style="color:#b91c1c;">ห้ามจ่ายยาหรืออนุพันธ์กลุ่มนี้เด็ดขาด</div>
          </div>
        </div>
      ` : `
        <div class="alert-box alert-success mb-3">
          <i class="fas fa-check-circle"></i>
          <div><strong>ไม่มีประวัติแพ้ยาที่บันทึกไว้</strong> (ปลอดภัย)</div>
        </div>
      `;
      
      let visitsHtml = '<p class="text-xs text-muted">ไม่มีประวัติการเข้ารับบริการที่ผ่านมา</p>';
      if (student.recentVisits && student.recentVisits.length > 0) {
        visitsHtml = '<div class="table-responsive"><table class="table-custom" style="font-size:0.8rem;"><thead><tr><th>วันที่</th><th>อาการ</th><th>ผลตรวจ</th></tr></thead><tbody>';
        student.recentVisits.forEach(v => {
          visitsHtml += `<tr><td>${v.date ? String(v.date).substring(0,10) : '-'}</td><td>${v.complaint || '-'}</td><td>${v.outcome || '-'}</td></tr>`;
        });
        visitsHtml += '</tbody></table></div>';
      }
      
      resContainer.style.display = 'block';
      resContainer.innerHTML = `
        ${allergyAlertHtml}
        
        <div class="digital-card mb-3">
          <div class="digital-card-header">
            <div>
              <div class="digital-card-org"><i class="fas fa-shield-alt"></i> วิทยาลัยพยาบาลทหารอากาศ</div>
              <div class="digital-card-sys">กรมแพทย์ทหารอากาศ • RTAFNC HEALTH</div>
            </div>
            <img class="digital-card-logo rtafnc-logo-img" alt="วพอ.">
          </div>
          <div class="digital-card-body">
            <div class="digital-card-info">
              <div class="digital-card-name">${student.Title || ''}${student.FirstName || ''} ${student.LastName || ''}</div>
              <div class="digital-card-id"><i class="fas fa-id-badge"></i> ${student.NumberOrOrder || student.RecipientID}</div>
              <div class="digital-card-meta">${student.Group || 'นพอ.'} | ${student.Level || '-'} | หมู่เลือด: ${student.BloodType || '-'}</div>
              <div class="digital-card-badges">
                <span class="digital-badge digital-badge-batch">${student.RecipientType || 'นพอ.'}</span>
                <span class="digital-badge digital-badge-blood">Blood: ${student.BloodType || '-'}</span>
                ${hasAllergy ? '<span class="digital-badge digital-badge-allergy">🚨 แพ้ยา: ' + student.DrugAllergies + '</span>' : ''}
              </div>
            </div>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <div class="p-2 border rounded bg-light">
              <span class="text-xs text-muted d-block">โรคประจำตัว</span>
              <strong>${student.CongenitalDiseases || '-'}</strong>
            </div>
          </div>
          <div class="col-6">
            <div class="p-2 border rounded bg-light">
              <span class="text-xs text-muted d-block">โรงพยาบาลประจำ</span>
              <strong>${student.RegularHospital || 'รพ.ภูมิพลอดุลยเดช พอ.'}</strong>
            </div>
          </div>
          <div class="col-6 mt-2">
            <div class="p-2 border rounded bg-light">
              <span class="text-xs text-muted d-block">น้ำหนัก / ส่วนสูง</span>
              <strong>${student.Weight || '-'} กก. / ${student.Height || '-'} ซม.</strong>
            </div>
          </div>
          <div class="col-6 mt-2">
            <div class="p-2 border rounded bg-light">
              <span class="text-xs text-muted d-block">ยาประจำตัว</span>
              <strong>${student.RegularMedicines || '-'}</strong>
            </div>
          </div>
        </div>

        <h5 class="section-title mb-2" style="font-size:0.9rem;"><i class="fas fa-history"></i> ประวัติการเข้ารับบริการที่ผ่านมา</h5>
        ${visitsHtml}

        <div class="mt-3 d-flex gap-2">
          <button type="button" class="btn btn-primary btn-block py-2" onclick="switchLiffTab('checkin')">
            <i class="fas fa-stethoscope"></i> แจ้งอาการป่วย / ขอรับบริการ
          </button>
          <button type="button" class="btn btn-outline btn-block py-2" onclick="switchLiffTab('card')">
            <i class="fas fa-qrcode"></i> บัตรสุขภาพดิจิทัล
          </button>
        </div>
      `;
      
      syncCollegeLogos();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('เกิดข้อผิดพลาดในการค้นหา: ' + err.message, 'danger');
    })
    .lookupStudentByStudentId(studentId);
}

function verifyCheckinStudentId() {
  const idInput = document.getElementById('liffCheckinStudentId');
  const preview = document.getElementById('liffCheckinStudentNamePreview');
  const val = idInput.value.trim();
  
  if (val.length === 7 && /^\d{7}$/.test(val)) {
    preview.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบรายชื่อ...';
    google.script.run
      .withSuccessHandler(function(student) {
        if (student) {
          liffCurrentStudent = student;
          preview.innerHTML = `✅ ${student.Title || ''}${student.FirstName || ''} ${student.LastName || ''} (${student.Group || 'นพอ.'})`;
          if (student.DrugAllergies && student.DrugAllergies !== '-') {
            preview.innerHTML += ` <span class="text-danger font-weight-bold">[🚨 แพ้ยา: ${student.DrugAllergies}]</span>`;
          }
        } else {
          preview.innerHTML = `<span class="text-danger">❌ ไม่พบรหัสนักเรียนนี้ในระบบ</span>`;
        }
      })
      .lookupStudentByStudentId(val);
  } else {
    preview.innerHTML = '';
  }
}

function handleLiffCheckinSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  
  const studentId = document.getElementById('liffCheckinStudentId').value.trim();
  const chiefComplaint = document.getElementById('liffChiefComplaint').value.trim();
  const location = document.getElementById('liffLocation').value;
  const details = document.getElementById('liffIncidentDetails').value.trim();
  const urgencyEl = document.querySelector('input[name="liffUrgency"]:checked');
  const urgency = urgencyEl ? urgencyEl.value : 'Green';
  
  if (!studentId || studentId.length !== 7 || !/^\d{7}$/.test(studentId)) {
    showToast('กรุณาระบุรหัสนักเรียน 7 หลักให้ถูกต้อง', 'warning');
    document.getElementById('liffCheckinStudentId').focus();
    return;
  }
  
  if (!chiefComplaint) {
    showToast('กรุณาระบุอาการสำคัญ', 'warning');
    document.getElementById('liffChiefComplaint').focus();
    return;
  }
  
  let lineDisplayName = '';
  if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
    try {
      const p = liff.getDecodedIDToken();
      if (p && p.name) lineDisplayName = p.name;
    } catch (e) {}
  }
  
  const payload = {
    studentId: studentId,
    chiefComplaint: chiefComplaint,
    incidentLocation: location,
    incidentDetails: details,
    urgencyLevel: urgency,
    lineDisplayName: lineDisplayName
  };
  
  const btn = document.getElementById('liffCheckinSubmitBtn');
  btn.disabled = true;
  showLoading('กำลังส่งข้อมูลแจ้งอาการป่วยเข้าห้องพยาบาล...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      btn.disabled = false;
      
      const resContainer = document.getElementById('liffCheckinSuccessCard');
      resContainer.style.display = 'block';
      resContainer.innerHTML = `
        <div class="card p-3 border-success" style="background:#f0fdf4; border: 2px solid #16a34a;">
          <div class="text-center mb-3">
            <i class="fas fa-check-circle text-success fa-3x"></i>
            <h4 class="mt-2 text-success font-weight-bold">แจ้งอาการเข้าห้องพยาบาลสำเร็จ</h4>
            <p class="text-xs text-muted">ระบบได้ส่งข้อมูลให้อาจารย์พยาบาลและพยาบาลเวรเรียบร้อยแล้ว</p>
          </div>
          <div class="bg-white p-3 rounded border mb-3 text-left">
            <div><strong>เลขที่บันทึก:</strong> <span class="badge badge-rtaf">${res.visitId}</span></div>
            <div><strong>นักเรียนพยาบาล:</strong> ${res.studentName} (รหัส: ${res.studentId})</div>
            <div><strong>เวลาส่งเรื่อง:</strong> ${res.timeIn} น.</div>
            <div><strong>อาการ:</strong> ${res.chiefComplaint}</div>
            <div><strong>ระดับความเร่งด่วน:</strong> ${res.urgencyLevel}</div>
          </div>
          <div class="text-center">
            <p class="text-xs text-muted mb-2">เมื่อเดินทางมาถึงห้องพยาบาล กรุณาแจ้งรหัส นพอ. 7 หลัก (${res.studentId})</p>
            ${typeof liff !== 'undefined' && liff.isInClient() ? '<button type="button" class="btn btn-outline btn-sm" onclick="liff.closeWindow()"><i class="fas fa-times-circle"></i> ปิดหน้าต่างนี้</button>' : ''}
          </div>
        </div>
      `;
      
      document.getElementById('liffCheckinForm').reset();
      document.getElementById('liffCheckinStudentNamePreview').innerHTML = '';
      showToast('ส่งเรื่องแจ้งอาการป่วยเข้าห้องพยาบาลเรียบร้อย', 'success');
      
      resContainer.scrollIntoView({ behavior: 'smooth' });
    })
    .withFailureHandler(function(err) {
      hideLoading();
      btn.disabled = false;
      showToast('ส่งข้อมูลไม่สำเร็จ: ' + err.message, 'danger');
    })
    .submitLiffSelfCheckin(payload);
}

      </div>
    </div>
    
    <div class="text-center mt-3">

      </button>
      <button type="button" class="btn btn-secondary btn-sm" onclick="switchLiffTab('lookup')">
        <i class="fas fa-search"></i> ค้นหารหัสอื่น

    </div>
  `;
  
  syncCollegeLogos();
}
</script>
