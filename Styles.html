<style>
/* นำเข้าฟอนต์ Kanit และ Bai Jamjuree จาก Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

:root {
  --primary: #0d9488;
  --primary-dark: #0f766e;
  --primary-light: #ccfbf1;
  --secondary: #f0fdfa;
  --text: #1f2937;
  --text-light: #6b7280;
  --border: #e5e7eb;
  --bg: #f8fafc;
  --white: #ffffff;
  --danger: #ef4444;
  --danger-dark: #dc2626;
  --warning: #f59e0b;
  --success: #10b981;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius: 12px;
  --radius-sm: 8px;
  --font-main: 'Kanit', 'Bai Jamjuree', sans-serif;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
}

/* Scrollbar ปรับแต่งให้ทันสมัย */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/* หน้าล็อกอิน */
.login-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: linear-gradient(135deg, #0f766e 0%, #115e59 50%, #134e4a 100%);
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.login-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #14b8a6, #0d9488);
}

.login-logo {
  font-size: 3rem;
  color: var(--primary);
  margin-bottom: 15px;
}

.login-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: #0f172a;
  margin-bottom: 5px;
}

.login-subtitle {
  font-size: 0.875rem;
  color: var(--text-light);
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
  text-align: left;
}

.form-label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  margin-bottom: 6px;
  color: #334155;
}

.form-control {
  width: 100%;
  padding: 10px 14px;
  font-family: var(--font-main);
  font-size: 0.95rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: var(--white);
  color: var(--text);
  outline: none;
  transition: var(--transition);
}

.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  font-family: var(--font-main);
  font-size: 0.95rem;
  font-weight: 500;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  gap: 8px;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--white);
}

.btn-primary:hover {
  background-color: var(--primary-dark);
  box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
}

.btn-danger {
  background-color: var(--danger);
  color: var(--white);
}

.btn-danger:hover {
  background-color: var(--danger-dark);
  box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
}

.btn-secondary {
  background-color: #cbd5e1;
  color: #334155;
}

.btn-secondary:hover {
  background-color: #94a3b8;
}

.btn-outline {
  background-color: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
}

.btn-outline:hover {
  background-color: var(--secondary);
}

.btn-block {
  width: 100%;
}

.login-demo-btn {
  margin-top: 15px;
  background-color: #f0fdfa;
  border: 1px dashed var(--primary);
  color: var(--primary);
}

.login-demo-btn:hover {
  background-color: var(--primary-light);
}

/* โครงสร้างเมนูด้านซ้ายและหน้าหลัก */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background-color: #1e293b;
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  transition: var(--transition);
  z-index: 100;
  box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
  position: relative;
}

.sidebar.collapsed {
  width: 70px;
}

.sidebar-header {
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #334155;
  gap: 12px;
  overflow: hidden;
}

.sidebar-logo {
  font-size: 1.5rem;
  color: #14b8a6;
  flex-shrink: 0;
}

.sidebar-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--white);
  white-space: nowrap;
  transition: opacity 0.2s;
}

.sidebar.collapsed .sidebar-title {
  opacity: 0;
  pointer-events: none;
}

.sidebar-menu {
  list-style: none;
  padding: 15px 10px;
  flex: 1;
  overflow-y: auto;
}

.sidebar-item {
  margin-bottom: 5px;
}

.sidebar-link {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  color: #94a3b8;
  text-decoration: none;
  border-radius: var(--radius-sm);
  transition: var(--transition);
  gap: 12px;
  font-size: 0.925rem;
  white-space: nowrap;
  cursor: pointer;
}

.sidebar-link i {
  font-size: 1.1rem;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-link span {
  transition: opacity 0.2s;
}

.sidebar.collapsed .sidebar-link span {
  opacity: 0;
  pointer-events: none;
  width: 0;
}

.sidebar-link:hover, .sidebar-link.active {
  color: var(--white);
  background-color: #334155;
}

.sidebar-link.active {
  background-color: var(--primary);
  box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25);
}

.sidebar-link.active i {
  color: var(--white);
}

/* Content Area */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Header */
.main-header {
  height: 70px;
  background-color: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 90;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.toggle-sidebar-btn {
  background: none;
  border: none;
  font-size: 1.25rem;
  color: var(--text-light);
  cursor: pointer;
  padding: 5px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.toggle-sidebar-btn:hover {
  background-color: var(--bg);
  color: var(--text);
}

.header-title-box {
  display: flex;
  flex-direction: column;
}

.header-org-name {
  font-size: 0.85rem;
  color: var(--text-light);
}

.header-sys-name {
  font-size: 1.15rem;
  font-weight: 600;
  color: #0f172a;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.demo-badge {
  background: linear-gradient(135deg, var(--danger) 0%, #be123c 100%);
  color: var(--white);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  animation: pulse 2s infinite;
  box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  background-color: var(--bg);
  border: 1px solid var(--border);
}

.profile-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: var(--primary);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}

.profile-info {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.profile-name {
  font-size: 0.875rem;
  font-weight: 500;
}

.profile-role {
  font-size: 0.75rem;
  color: var(--text-light);
}

/* Page Body Container */
.page-container {
  padding: 24px;
  flex: 1;
  overflow-y: auto;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}

/* Cards & Layouts */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.stat-card {
  background-color: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--primary);
}

.stat-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
}

.stat-icon.primary { background-color: var(--secondary); color: var(--primary); }
.stat-icon.warning { background-color: #fef3c7; color: var(--warning); }
.stat-icon.danger { background-color: #fee2e2; color: var(--danger); }
.stat-icon.success { background-color: #dcfce7; color: var(--success); }

.stat-info {
  display: flex;
  flex-direction: column;
}

.stat-value {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.2;
}

.stat-label {
  font-size: 0.85rem;
  color: var(--text-light);
}

/* Table Card */
.card {
  background-color: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
  overflow: hidden;
}

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #0f172a;
}

.card-body {
  padding: 20px;
}

/* Filter controls */
.search-filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 240px;
  position: relative;
}

.search-box i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
}

.search-box input {
  padding-left: 40px;
}

.filter-select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  font-family: var(--font-main);
  background-color: var(--white);
  min-width: 150px;
}

/* Tables */
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.table-custom {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.925rem;
}

.table-custom th {
  background-color: #f1f5f9;
  padding: 12px 16px;
  font-weight: 600;
  color: #475569;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

.table-custom td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: #334155;
}

.table-custom tr:hover {
  background-color: #f8fafc;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 500;
  gap: 4px;
}

.badge-success { background-color: #dcfce7; color: var(--success); }
.badge-danger { background-color: #fee2e2; color: var(--danger); }
.badge-warning { background-color: #fef3c7; color: var(--warning); }
.badge-info { background-color: #e0f2fe; color: #0284c7; }
.badge-secondary { background-color: #e2e8f0; color: #475569; }

/* Grid forms */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  padding: 20px;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background-color: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  width: 100%;
  max-width: 800px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: translateY(-20px);
  transition: transform 0.3s ease;
  overflow: hidden;
}

.modal-box.large {
  max-width: 1000px;
}

.modal-box.small {
  max-width: 460px;
}

.modal-overlay.active .modal-box {
  transform: translateY(0);
}

.modal-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f8fafc;
}

.modal-close-btn {
  background: none;
  border: none;
  font-size: 1.25rem;
  color: var(--text-light);
  cursor: pointer;
  padding: 5px;
  transition: var(--transition);
}

.modal-close-btn:hover {
  color: var(--danger);
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background-color: #f8fafc;
}

/* Loading Overlay */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(255, 255, 255, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.loading-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid var(--secondary);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 0.95rem;
  color: var(--primary);
  font-weight: 500;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  background-color: var(--white);
  border-left: 4px solid var(--primary);
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 300px;
  transform: translateX(120%);
  transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.toast.active {
  transform: translateX(0);
}

.toast-icon {
  font-size: 1.25rem;
}

.toast.success { border-left-color: var(--success); }
.toast.success .toast-icon { color: var(--success); }
.toast.danger { border-left-color: var(--danger); }
.toast.danger .toast-icon { color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.warning .toast-icon { color: var(--warning); }

.toast-message {
  font-size: 0.9rem;
  font-weight: 500;
}

/* Alert Box */
.alert-box {
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  font-size: 0.9rem;
}

.alert-danger {
  background-color: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fecaca;
}

.alert-warning {
  background-color: #fef3c7;
  color: #b45309;
  border: 1px solid #fde68a;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}

.empty-icon {
  font-size: 3rem;
  margin-bottom: 10px;
  color: #cbd5e1;
}

/* UI details */
.alert-pill {
  background-color: var(--danger);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  display: inline-block;
  margin-left: 5px;
}

.text-warning-bold {
  color: var(--danger);
  font-weight: 600;
}

/* Responsive Styles */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: -260px;
    width: 260px;
  }
  
  .sidebar.mobile-active {
    left: 0;
  }
  
  .sidebar.collapsed {
    left: -260px;
  }
  
  .sidebar.collapsed.mobile-active {
    left: 0;
  }
  
  .main-content {
    width: 100%;
  }
  
  .stat-card {
    padding: 15px;
  }
  
  .stat-value {
    font-size: 1.5rem;
  }
  
  .search-filter-bar {
    flex-direction: column;
    align-items: stretch;
  }
  
  .filter-select, .search-box {
    width: 100%;
  }
}

/* ปรับแต่งสำหรับพิมพ์รายงานใบส่งตัว (Print Styles) */
@media print {
  body {
    background-color: white;
    color: black;
    font-size: 12pt;
  }
  .sidebar, .main-header, .btn, .search-filter-bar, .toast-container, .modal-overlay, .loading-overlay {
    display: none !important;
  }
  .main-content, .page-container, .card, .card-body {
    margin: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
    border: none !important;
    width: 100% !important;
  }
  .print-only {
    display: block !important;
  }
  .no-print {
    display: none !important;
  }
}

.print-only {
  display: none;
}
</style>
